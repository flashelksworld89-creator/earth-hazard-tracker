name: Build GDELT Historical Index
# Seed 1980 index on workflow changes

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year to build (1979-2013) or 'all'"
        required: true
        default: "1980"
  push:
    paths:
      - ".github/workflows/build-gdelt-history.yml"

permissions:
  contents: write

jobs:
  build-seed:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 1980 historical index
        run: python3 scripts/build-gdelt-history.py --year 1980
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gdelt-history/1980.json
          git diff --cached --quiet || git commit -m "Build GDELT historical index for 1980"
          git push

  build-one:
    if: github.event_name == 'workflow_dispatch' && inputs.year != 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-gdelt-history.py --year ${{ inputs.year }}
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gdelt-history/${{ inputs.year }}.json
          git diff --cached --quiet || git commit -m "Build GDELT historical index for ${{ inputs.year }}"
          git push

  build-all:
    if: github.event_name == 'workflow_dispatch' && inputs.year == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [1980,1981,1982,1983,1984,1985,1986,1987,1988,1989,1990,1991,1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-gdelt-history.py --year ${{ matrix.year }} --outdir /tmp/gdelt
      - uses: actions/upload-artifact@v4
        with:
          name: gdelt-${{ matrix.year }}
          path: /tmp/gdelt/${{ matrix.year }}.json

  merge-all:
    if: github.event_name == 'workflow_dispatch' && inputs.year == 'all'
    needs: build-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gdelt-*
          path: data/gdelt-history
          merge-multiple: true
      - name: Commit all generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gdelt-history/*.json
          git diff --cached --quiet || git commit -m "Build GDELT historical indexes 1980-2013"
          git push
